name: Publish to npm

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Verify package contents
        run: |
          npm run build
          npm pack --dry-run --json --ignore-scripts > package-contents.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("package-contents.json", "utf8"))[0].files;
            const paths = new Set(files.map(({ path }) => path));
            const required = ["dist/index.js", "dist/index.d.ts"];
            const missing = required.filter((path) => !paths.has(path));
            if (missing.length) {
              console.error("missing package output:\n" + missing.join("\n"));
              process.exit(1);
            }
            console.log("package contains runtime and type entry points");
          '

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json is $PKG_VERSION but tag is $TAG_VERSION" >&2
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
